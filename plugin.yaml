name: cloudflare-tools
version: 0.5.0
description: "Cloudflare tools for coding agents: zones, DNS, analytics, Workers, Pages, storage and tunnels."
manifest_version: 1
requires_hermes: ">=0.22"
provides_tools:
  - cloudflare_account_read
  - cloudflare_analytics_read
  - cloudflare_dns_read
  - cloudflare_dns_record_add
  - cloudflare_dns_record_delete
  - cloudflare_dns_record_edit
  - cloudflare_pages_domain_add
  - cloudflare_pages_domain_remove
  - cloudflare_pages_read
  - cloudflare_pages_rollback
  - cloudflare_workers_read
  - cloudflare_workers_rollback
  - cloudflare_zone_cache_purge
  - cloudflare_zone_cache_purge_all
  - cloudflare_zone_dnssec_disable
  - cloudflare_zone_dnssec_enable
  - cloudflare_zone_read
  - cloudflare_zone_setting_edit
  - cloudflare_zone_setting_weaken
provides_hooks:
  - pre_tool_call
config_schema:
  toolsets:
    description: 'The toolsets that are on: a list of toolset names, or "all". Defaults to the package''s default toolsets.'
  read_only:
    type: bool
    description: Registers no tool that writes. Wins over every other setting.
  tools:
    type: list
    description: Single tools to add by id, whatever their toolset.
  exclude_tools:
    type: list
    description: Single tools to remove by id. Wins over tools and toolsets.
